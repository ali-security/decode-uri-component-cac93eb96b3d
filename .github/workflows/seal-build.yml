name: seal-build

on:
  workflow_dispatch: {}

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '6.9.1'
      - name: Pack
        run: |
          node --version
          npm --version
          npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: 'decode-uri-component-*.tgz'
          if-no-files-found: error
